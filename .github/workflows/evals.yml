name: evals

# Runs the full pipeline on a CPU runner with a small model and fails if the
# graph-mode source_hit drops below the gate. Manual, because pulling models
# and answering ~20 questions on CPU takes several minutes.
on:
  workflow_dispatch:
    inputs:
      llm_model:
        description: "Ollama model for answers"
        default: "qwen2.5:1.5b"
      min_source_hit:
        description: "Gate for graph-mode source_hit"
        default: "0.6"

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/graphrag-demo
        ports: ["7687:7687"]
      ollama:
        image: ollama/ollama:latest
        ports: ["11434:11434"]
    env:
      KHG_LLM_MODEL: ${{ inputs.llm_model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Pull models
        run: |
          for m in "$KHG_LLM_MODEL" nomic-embed-text; do
            curl -sf http://localhost:11434/api/pull -d "{\"model\": \"$m\", \"stream\": false}"
          done
      - name: Wait for Neo4j
        run: |
          for i in $(seq 1 30); do
            python -c "from neo4j import GraphDatabase as G; G.driver('bolt://localhost:7687', auth=('neo4j','graphrag-demo')).verify_connectivity()" && exit 0
            sleep 5
          done
          exit 1
      - run: python -m kh_graphrag ingest --reset
      - run: python -m kh_graphrag eval --min-source-hit ${{ inputs.min_source_hit }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
      - if: always()
        run: cat evals/results/latest.md >> "$GITHUB_STEP_SUMMARY"
